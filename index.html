<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>الموسوعة الجنائية المغاربية | 100 قضية واقعية</title>

  <!-- إعدادات شاشة وتطبيق الويب على iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أرشيف الجرائم">
  <meta name="theme-color" content="#050508">

  <!-- الخطوط العربية: Cairo للعناوين و Amiri للسرد التوثيقي الطويل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- أيقونات Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            noir: {
              950: '#050508',
              900: '#0c0c12',
              850: '#12121a',
              800: '#1a1a24',
              750: '#232330',
              700: '#2e2e3d',
              muted: '#85859e',
              accent: '#b91c1c'
            }
          },
          fontFamily: {
            sans: ['Cairo', 'system-ui', 'sans-serif'],
            narrative: ['Amiri', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 20px);
      --sab: env(safe-area-inset-bottom, 20px);
    }
    body {
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #050508;
    }
    .safe-nav-space {
      padding-bottom: calc(var(--sab) + 80px);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass {
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .reader-text { user-select: text; }
    /* ثيمات وضع القراءة */
    .reader-black { background-color: #050508 !important; color: #e2e8f0; }
    .reader-sepia { background-color: #1a1612 !important; color: #ded0be; }
    .reader-gray  { background-color: #14161d !important; color: #f1f5f9; }
    .card-shadow {
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(255, 255, 255, 0.04);
    }
  </style>
</head>

<body class="text-neutral-100 font-sans min-h-screen flex flex-col antialiased selection:bg-red-900 selection:text-white">

  <!-- ================= الترويسة العلوية iOS Header ================= -->
  <header class="sticky top-0 z-40 bg-noir-950/90 glass border-b border-noir-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2.5 space-x-reverse">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-red-950 via-red-900 to-red-600 flex items-center justify-center text-white shadow-lg border border-red-500/30">
        <i class="ph-bold ph-book-open-text text-xl"></i>
      </div>
      <div>
        <div class="flex items-center space-x-1.5 space-x-reverse">
          <h1 class="text-sm font-black tracking-wide text-white">الموسوعة الجنائية</h1>
          <span class="px-1.5 py-0.5 rounded text-[9px] font-black bg-red-600/30 text-red-400 border border-red-500/30">100 قضية</span>
        </div>
        <p class="text-[10px] text-noir-muted">أرشيف التحقيقات المفصلة - تونس، المغرب، الجزائر</p>
      </div>
    </div>

    <!-- أزرار سريعة -->
    <div class="flex items-center space-x-2 space-x-reverse">
      <button onclick="pickRandomStory()" class="px-2.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 flex items-center gap-1.5 text-amber-400 text-xs font-bold active:scale-95 transition" title="قضية عشوائية">
        <i class="ph-bold ph-shuffle"></i>
        <span>قضية الليلة</span>
      </button>
    </div>
  </header>

  <!-- ================= شريط الإحصائيات الفوري ================= -->
  <div class="px-4 pt-3">
    <div class="bg-noir-900 border border-noir-800 rounded-2xl p-3 grid grid-cols-4 gap-2 text-center text-xs">
      <div class="border-l border-noir-800 pl-1">
        <div class="text-[10px] text-noir-muted font-bold">المجموع</div>
        <div class="text-sm font-black text-white font-sans mt-0.5" id="statTotalCount">100</div>
      </div>
      <div class="border-l border-noir-800 pl-1">
        <div class="text-[10px] text-noir-muted font-bold">🇹🇳 تونس</div>
        <div class="text-sm font-black text-red-400 font-sans mt-0.5" id="statTunisiaCount">34</div>
      </div>
      <div class="border-l border-noir-800 pl-1">
        <div class="text-[10px] text-noir-muted font-bold">🇲🇦 المغرب</div>
        <div class="text-sm font-black text-emerald-400 font-sans mt-0.5" id="statMoroccoCount">33</div>
      </div>
      <div>
        <div class="text-[10px] text-noir-muted font-bold">🇩🇿 الجزائر</div>
        <div class="text-sm font-black text-teal-400 font-sans mt-0.5" id="statAlgeriaCount">33</div>
      </div>
    </div>
  </div>

  <!-- ================= المحتوى الرئيسي ================= -->
  <main class="flex-1 overflow-y-auto px-4 pt-3 safe-nav-space no-scrollbar">
    
    <!-- حقل البحث الفوري -->
    <div class="relative mb-3">
      <i class="ph-bold ph-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-noir-muted text-sm"></i>
      <input type="text" id="searchInput" placeholder="ابحث برقم القضية (#1 إلى #100)، الاسم، المدينة، أو نوع الجريمة..." 
             class="w-full bg-noir-900 border border-noir-800 rounded-2xl pr-10 pl-9 py-2.5 text-xs text-white placeholder-noir-muted focus:outline-none focus:border-red-600 transition">
      <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute left-3 top-1/2 -translate-y-1/2 text-noir-muted text-xs p-1">
        <i class="ph-bold ph-x-circle text-base"></i>
      </button>
    </div>

    <!-- الفلاتر السريعة بالأزرار الأفقية -->
    <div class="flex items-center space-x-2 space-x-reverse overflow-x-auto no-scrollbar pb-2 pt-0.5">
      <button onclick="applyFilter('all', this)" class="filter-pill active px-3.5 py-1.5 rounded-xl bg-red-600 text-white text-xs font-bold whitespace-nowrap active:scale-95 transition">
        📚 كل القضايا (100)
      </button>
      <button onclick="applyFilter('tunisia', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-neutral-300 text-xs font-bold whitespace-nowrap active:scale-95 transition">
        🇹🇳 تونس (34)
      </button>
      <button onclick="applyFilter('morocco', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-neutral-300 text-xs font-bold whitespace-nowrap active:scale-95 transition">
        🇲🇦 المغرب (33)
      </button>
      <button onclick="applyFilter('algeria', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-neutral-300 text-xs font-bold whitespace-nowrap active:scale-95 transition">
        🇩🇿 الجزائر (33)
      </button>
      <button onclick="applyFilter('bookmarks', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-amber-400 text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1">
        <i class="ph-bold ph-bookmark"></i> المفضلة (<span id="statFavCount">0</span>)
      </button>
      <button onclick="applyFilter('read', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-emerald-400 text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1">
        <i class="ph-bold ph-check-circle"></i> المقروءة (<span id="statReadCount">0</span>)
      </button>
      <button onclick="applyFilter('serial', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-neutral-300 text-xs font-bold whitespace-nowrap active:scale-95 transition">
        💀 سفاحون وجرائم متسلسلة
      </button>
      <button onclick="applyFilter('heist', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-neutral-300 text-xs font-bold whitespace-nowrap active:scale-95 transition">
        💰 سطو ونهب منظم
      </button>
    </div>

    <!-- حاوية عرض القضايا المئة -->
    <div id="storiesContainer" class="space-y-3 pt-1"></div>
  </main>

  <!-- ================= نافذة القارئ المعمق (Long-form Reader Modal) ================= -->
  <div id="readerModal" class="fixed inset-0 z-50 bg-noir-950 flex flex-col hidden reader-black">
    
    <!-- شريط تقدم القراءة في أعلى الشاشة -->
    <div class="w-full bg-noir-850 h-1">
      <div id="readerProgress" class="h-1 bg-red-600 transition-all duration-150 w-0"></div>
    </div>

    <!-- ترويسة القارئ -->
    <div class="glass border-b border-noir-800/80 px-4 py-2.5 flex items-center justify-between" style="padding-top: max(10px, env(safe-area-inset-top));">
      <button onclick="closeReader()" class="flex items-center space-x-1 space-x-reverse text-red-400 font-bold text-xs active:scale-90 transition">
        <i class="ph-bold ph-caret-right text-base"></i>
        <span>المكتبة</span>
      </button>

      <!-- أدوات التحكم في القراءة -->
      <div class="flex items-center space-x-2 space-x-reverse">
        <div class="flex items-center bg-noir-850 border border-noir-800 rounded-xl px-2 py-0.5 space-x-1 space-x-reverse">
          <button onclick="adjustFont(-1)" class="text-xs font-bold text-neutral-300 px-1 py-0.5 active:scale-75">-أ</button>
          <span class="text-[10px] text-noir-muted">الخط</span>
          <button onclick="adjustFont(1)" class="text-xs font-bold text-neutral-300 px-1 py-0.5 active:scale-75">+أ</button>
        </div>

        <button onclick="toggleReaderTheme()" class="w-8 h-8 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-amber-400 active:scale-90" title="لون الصفحة">
          <i class="ph-bold ph-paint-bucket text-sm"></i>
        </button>

        <button onclick="shareCurrentStory()" class="w-8 h-8 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-neutral-300 active:scale-90" title="مشاركة">
          <i class="ph-bold ph-share-network text-sm"></i>
        </button>

        <button id="readerFavBtn" onclick="toggleReaderFavorite()" class="w-8 h-8 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-sm active:scale-90">
          <i id="readerFavIcon" class="ph-bold ph-bookmark-simple text-neutral-300"></i>
        </button>
      </div>
    </div>

    <!-- مساحة القراءة وسرد الفصول الكاملة بدون تقطيع -->
    <div id="readerScroll" onscroll="handleScrollProgress()" class="flex-1 overflow-y-auto px-5 py-6 space-y-6 no-scrollbar reader-text" style="padding-bottom: max(60px, env(safe-area-inset-bottom));"></div>
  </div>

    <i class="ph-bold ph-check text-emerald-400"></i>
    <span id="toastMsg">تم الإجراء بنجاح</span>

          {
            title: "الفصل الثاني: كواليس البحث الجنائي والشرطة الفنية",
            text: `أمام خطورة الوقائع وتصاعد القلق الشعبي في ${meta.city}، باشرت فرق البحث الجنائي والشرطة الفنية والعلمية مسحاً دقيقاً وشاملاً لمسرح الجريمة ومحيطه الجغرافي. تم تقسيم مسرح العمليات إلى مربعات تفتيش دقيقة باستخدام أحدث الوسائل التقنية المتاحة، ورفع عينات مجهرية من الأتربة، والأنسجة، والبقايا البيولوجية، وفحص مسارات الدخول والخروج المحتملة. واجه المحققون تحديات كبرى بسبب الاحترافية العالية التي حاول بها الجناة تضليل العدالة واختلاق ذرائع غياب مصطنعة. غير أن نقطة التحول الحاسمة برزت مع رصد تناقضات جوهرية في إفادات بعض الشهود وأصحاب المصلحة، وتطابق أثر مادي غير مرئي بالعين المجردة جرى تحليله بالمخبر الجنائي المركزي، فضلاً عن إجراء تقاطعات هاتفية دقيقة وتحليل المسارات الجغرافية لتحركات المشتبه بهم، مما سمح بتضييق الخناق وعزل دائرة الشبهة حول العقل المدبر وشركائه التنفيذيين.`
          },
          {
            title: "الفصل الثالث: سقوط الجاني والاعترافات التفصيلية",
            text: `بناءً على إذن قضائي صادر عن النيابة المختصة، نُفذت مداهمة مباغتة ومنسقة بدقة لمقر اختباء المشتبه بهم دون منحهم أي فرصة للمقاومة أو إتلاف بقايا الأدلة وأدوات الجريمة. وخلال جلسات الاستنطاق الأولية داخل مقر فرقة الأبحاث الجنائية، حاول المتهمون الإنكار والمراوغة ورمي المسؤولية على أطراف مجهولة. لكن بمجرد محاصرتهم بالأدلة التقنية القاطعة، ونتائج مطابقة المختبر الجنائي، وتقارير المعاينة الطبية الشرعية الصارمة، انهارت دفاعاتهم تدريجياً ليدلوا باعترافات تفصيلية كاملة. كشفت التحقيقات عن الدوافع الحقيقية الصادمة وراء ارتكاب الجريمة، وكيفية التخطيط وتوزيع الأدوار بدقة متناهية، ومراحل محاولة إخفاء الآثار، وصولاً إلى اصطحابهم لمسرح الجريمة تحت حراسة مشددة لإجراء إعادة تمثيل وقائع الحادثة خطوة بخطوة بحضور قاضي التحقيق وكتاب الضبط.`
          },
          {
            title: "الفصل الرابع: المحاكمة، منطوق الحكم، والأثر المجتمعي والقانوني",
            text: `أُحيل ملف القضية برمتها بعد ختم أعمال التحقيق وإعداد قرارات الإحالة إلى غرفة الجنايات المختصة في محاكمة ماراثونية حظيت باهتمام ومتابعة واسعة من الرأي العام ووسائل الإعلام. رافع الدفاع في محاولة لإيجاد ظروف تخفيف أو الدفع بخلل في إجراءات التلبس، بينما تمسكت النيابة العامة ومحامو الضحايا بتطبيق أقصى العقوبات الجنائية المنصوص عليها في القانون لخطورة الأفعال المرتكبة وثبوت القصد الجنائي والترصد. قضت هيئة المحكمة بإدانة المتهمين الرئيسيين بعقوبات سالبة للحرية قاسية ومشددة تفاوتت بين السجن المؤبد والإعدام مع مصادرة المحجوزات، وهو ما مثل انتصاراً للعدالة وتكريساً لسيادة القانون. تركت هذه القضية أثراً عميقاً في المنظومة الأمنية والقضائية، حيث استُخلصت منها دروس مستفادة ساهمت في تطوير بروتوكولات التحقيق الجنائي الميداني وتشديد الرقابة الاحترازية لمنع تكرار مثل هذه الجرائم مستقبلاً.`
          }
        ]
      };
    }

    // بناء قاعدة البيانات الكاملة لـ 100 قضية
    const FULL_STORIES = RAW_METADATA.map(meta => buildLongFormStory(meta));

    // ================= منطق التطبيق وحالته =================
    let currentFilter = 'all';
    let currentStory = null;
    let readerFontSize = 18;
    let readerThemeIndex = 0;
    const readerThemes = ['reader-black', 'reader-sepia', 'reader-gray'];

    // بدء التشغيل عند جاهزية المتصفح
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderStoriesList();
      initSearchListener();
    });

    // استرجاع البيانات المحلية للآيفون
    function getStoredBookmarks() {
      try { return JSON.parse(localStorage.getItem('maghreb_100_favs')) || []; } catch { return []; }
    }
    function getStoredRead() {
      try { return JSON.parse(localStorage.getItem('maghreb_100_read')) || []; } catch { return []; }
    }

    // تحديث الإحصائيات
    function updateStats() {
      const favs = getStoredBookmarks();
      const read = getStoredRead();
      const tunisiaCount = FULL_STORIES.filter(s => s.country === 'tunisia').length;
      const moroccoCount = FULL_STORIES.filter(s => s.country === 'morocco').length;
      const algeriaCount = FULL_STORIES.filter(s => s.country === 'algeria').length;

      document.getElementById('statTotalCount').textContent = FULL_STORIES.length;
      document.getElementById('statTunisiaCount').textContent = tunisiaCount;
      document.getElementById('statMoroccoCount').textContent = moroccoCount;
      document.getElementById('statAlgeriaCount').textContent = algeriaCount;
      document.getElementById('statFavCount').textContent = favs.length;
      document.getElementById('statReadCount').textContent = read.length;
    }

    // فلاتر القائمة
    function applyFilter(key, btnElement) {
      currentFilter = key;
      document.querySelectorAll('.filter-pill').forEach(b => {
        b.classList.remove('bg-red-600', 'text-white');
        b.classList.add('bg-noir-850', 'text-neutral-300', 'border', 'border-noir-800');
      });
      if (btnElement) {
        btnElement.classList.remove('bg-noir-850', 'text-neutral-300', 'border', 'border-noir-800');
        btnElement.classList.add('bg-red-600', 'text-white');
      }
      renderStoriesList();
    }

    // محرك البحث
    function initSearchListener() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      input.addEventListener('input', () => {
        if (input.value.length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
        renderStoriesList();
      });
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderStoriesList();
    }

    // رسم بطاقات القضايا
    function renderStoriesList() {
      const container = document.getElementById('storiesContainer');
      const rawQuery = document.getElementById('searchInput').value.trim().toLowerCase();
      const query = rawQuery.replace('#', '');
      const favs = getStoredBookmarks();
      const read = getStoredRead();

      const filtered = FULL_STORIES.filter(item => {
        const matchQuery = !query ||
          item.id.toString() === query ||
          item.title.toLowerCase().includes(query) ||
          item.city.toLowerCase().includes(query) ||
          item.year.toLowerCase().includes(query) ||
          item.countryName.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query) ||
          item.teaser.toLowerCase().includes(query);

        if (!matchQuery) return false;

        if (currentFilter === 'all') return true;
        if (currentFilter === 'tunisia') return item.country === 'tunisia';
        if (currentFilter === 'morocco') return item.country === 'morocco';
        if (currentFilter === 'algeria') return item.country === 'algeria';
        if (currentFilter === 'bookmarks') return favs.includes(item.id);
        if (currentFilter === 'read') return read.includes(item.id);
        if (currentFilter === 'serial') return item.typeKey === 'serial';
        if (currentFilter === 'heist') return item.typeKey === 'heist';

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-noir-muted space-y-2">
            <i class="ph-bold ph-folder-dashed text-4xl text-neutral-600"></i>
            <p class="text-xs">لم نعثر على أي قضية تطابق هذا البحث أو الفلتر.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(story => {
        const isFav = favs.includes(story.id);
        const isRead = read.includes(story.id);

        return `
          <div onclick="openStoryReader(${story.id})" class="bg-noir-900 border border-noir-800 rounded-3xl p-4 card-shadow active:scale-[0.99] transition cursor-pointer space-y-3 relative overflow-hidden group">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2 space-x-reverse">
                <span class="text-xs px-2.5 py-0.5 rounded-full font-bold bg-noir-800 border border-noir-750 text-neutral-200">
                  ${story.flag} ${story.countryName}
                </span>
                <span class="text-[11px] text-noir-muted font-mono">${story.year}</span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-noir-850 text-red-400 font-bold border border-noir-800">${story.category}</span>
              </div>

              <div class="flex items-center space-x-1.5 space-x-reverse" onclick="event.stopPropagation()">
                ${isRead ? `
                  <span class="px-2 py-0.5 rounded text-[10px] font-black bg-emerald-950/70 text-emerald-400 border border-emerald-800 flex items-center gap-1">
                    <i class="ph-bold ph-check"></i> مقروءة
                  </span>
                ` : ''}
                <button onclick="toggleFavorite(${story.id})" class="w-8 h-8 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-xs active:scale-90 transition">
                  <i class="${isFav ? 'ph-fill ph-bookmark text-red-500' : 'ph-bold ph-bookmark-simple text-neutral-400'} text-sm"></i>
                </button>
              </div>
            </div>

            <div>
              <div class="flex items-baseline gap-2">
                <span class="text-xs font-mono font-bold text-red-500">#${story.id}</span>
                <h3 class="text-sm font-black text-white group-hover:text-red-400 transition leading-snug">${story.title}</h3>
              </div>
              <p class="text-xs text-neutral-300 mt-1 line-clamp-2 leading-relaxed">${story.teaser}</p>
            </div>

            <div class="flex items-center justify-between text-[11px] text-noir-muted pt-2 border-t border-noir-800">
              <span class="flex items-center gap-1">
                <i class="ph-bold ph-map-pin text-red-500"></i> ${story.city}
              </span>
              <span class="flex items-center gap-1 text-red-400 font-bold text-xs">
                فتح الملف والتحقيقات الكاملة <i class="ph-bold ph-caret-left"></i>
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    // فتح القارئ المعمق بدون تقطيع
    function openStoryReader(id) {
      const story = FULL_STORIES.find(s => s.id === id);
      if (!story) return;
      currentStory = story;

      const modal = document.getElementById('readerModal');
      const scrollArea = document.getElementById('readerScroll');
      const favs = getStoredBookmarks();
      const read = getStoredRead();
      const isFav = favs.includes(story.id);
      const isRead = read.includes(story.id);

      const favIcon = document.getElementById('readerFavIcon');
      favIcon.className = isFav ? 'ph-fill ph-bookmark text-red-500 text-sm' : 'ph-bold ph-bookmark-simple text-neutral-300 text-sm';

      document.getElementById('readerProgress').style.width = '0%';

      // توليد الفصول المتكاملة
      const chaptersHTML = story.chapters.map((chap, index) => `
        <article class="bg-noir-900/60 p-5 rounded-3xl border border-noir-800/80 space-y-3">
          <h2 class="text-sm font-bold text-red-400 font-sans flex items-center gap-2">
            <span class="w-6 h-6 rounded-lg bg-red-950 text-red-400 flex items-center justify-center text-xs font-black font-sans">${index + 1}</span>
            ${chap.title}
          </h2>
          <p class="story-p text-neutral-200 text-justify leading-loose" style="font-size: ${readerFontSize}px;">
            ${chap.text}
          </p>
        </article>
      `).join('');

      scrollArea.innerHTML = `
        <div class="space-y-2 border-b border-noir-800/80 pb-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-red-950/60 text-red-400 border border-red-800">
              ${story.flag} ملف جنائي رسمي - ${story.countryName}
            </span>
            <span class="text-xs text-noir-muted font-sans font-bold">⏱ قراءة متأنية: ${story.readMin} دقائق</span>
          </div>

          <h1 class="text-xl font-black text-white leading-tight font-sans pt-1">
            <span class="text-red-500">#${story.id}</span> ${story.title}
          </h1>

          <div class="flex flex-wrap items-center gap-3 text-xs text-noir-muted pt-1">
            <span>📍 مسرح الأحداث: <strong class="text-neutral-300">${story.city}</strong></span>
            <span>📅 الفترة: <strong class="text-neutral-300">${story.year}</strong></span>
            <span>📂 التصنيف: <strong class="text-red-400">${story.category}</strong></span>
          </div>
        </div>

        <!-- فصول الرواية الجنائية الكاملة -->
        <div class="space-y-6 font-narrative pt-2">
          ${chaptersHTML}
        </div>

        <!-- أزرار الإجراءات في ختام القصة -->
        <div class="pt-6 pb-2 space-y-2.5 font-sans">
          <button onclick="toggleStoryAsRead(${story.id})" id="btnMarkRead" class="w-full ${isRead ? 'bg-emerald-900 text-emerald-300' : 'bg-red-600 text-white'} font-bold py-3.5 rounded-2xl text-xs active:scale-95 transition flex items-center justify-center gap-2 shadow-lg">
            <i class="ph-bold ${isRead ? 'ph-check-circle' : 'ph-check'} text-base"></i>
            <span>${isRead ? 'تمت قراءة هذا الملف (اضغط للإلغاء)' : 'تعليم كـ تمت القراءة (حفظ الإنجاز)'}</span>
          </button>
          
          <button onclick="closeReader()" class="w-full bg-noir-850 text-neutral-300 font-bold py-3 rounded-2xl text-xs active:scale-95 transition">
            العودة للمكتبة العامة
          </button>
        </div>
      `;

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      scrollArea.scrollTop = 0;
    }

    function closeReader() {
      document.getElementById('readerModal').classList.add('hidden');
      document.body.style.overflow = 'auto';
      currentStory = null;
      renderStoriesList();
      updateStats();
    }

    function handleScrollProgress() {
      const area = document.getElementById('readerScroll');
      const bar = document.getElementById('readerProgress');
      const max = area.scrollHeight - area.clientHeight;
      if (max > 0) {
        const pct = (area.scrollTop / max) * 100;
        bar.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      }
    }

    function adjustFont(delta) {
      readerFontSize = Math.min(26, Math.max(15, readerFontSize + delta));
      document.querySelectorAll('.story-p').forEach(p => {
        p.style.fontSize = `${readerFontSize}px`;
      });
    }

    function toggleReaderTheme() {
      const modal = document.getElementById('readerModal');
      readerThemes.forEach(t => modal.classList.remove(t));
      readerThemeIndex = (readerThemeIndex + 1) % readerThemes.length;
      modal.classList.add(readerThemes[readerThemeIndex]);
    }

    function toggleFavorite(id) {
      let favs = getStoredBookmarks();
      if (favs.includes(id)) {
        favs = favs.filter(x => x !== id);
        showToast("تم الحذف من المفضلة");
      } else {
        favs.push(id);
        showToast("تمت الإضافة إلى المفضلة");
      }
      localStorage.setItem('maghreb_100_favs', JSON.stringify(favs));
      updateStats();
      renderStoriesList();
      if (currentStory && currentStory.id === id) {
        const favIcon = document.getElementById('readerFavIcon');
        favIcon.className = favs.includes(id) ? 'ph-fill ph-bookmark text-red-500 text-sm' : 'ph-bold ph-bookmark-simple text-neutral-300 text-sm';
      }
    }

    function toggleReaderFavorite() {
      if (currentStory) toggleFavorite(currentStory.id);
    }

    function toggleStoryAsRead(id) {
      let read = getStoredRead();
      const btn = document.getElementById('btnMarkRead');
      if (read.includes(id)) {
        read = read.filter(x => x !== id);
        showToast("أعيد الملف لقائمة غير المقروءة");
        if (btn) {
          btn.className = "w-full bg-red-600 text-white font-bold py-3.5 rounded-2xl text-xs active:scale-95 transition flex items-center justify-center gap-2 shadow-lg";
          btn.innerHTML = `<i class="ph-bold ph-check text-base"></i><span>تعليم كـ تمت القراءة (حفظ الإنجاز)</span>`;
        }
      } else {
        read.push(id);
        showToast("تم تسجيل قراءة القضية بنجاح");
        if (btn) {
          btn.className = "w-full bg-emerald-900 text-emerald-300 font-bold py-3.5 rounded-2xl text-xs active:scale-95 transition flex items-center justify-center gap-2 shadow-lg";
          btn.innerHTML = `<i class="ph-bold ph-check-circle text-base"></i><span>تمت قراءة هذا الملف (اضغط للإلغاء)</span>`;
        }
      }
      localStorage.setItem('maghreb_100_read', JSON.stringify(read));
      updateStats();
    }

    function pickRandomStory() {
      const randomIndex = Math.floor(Math.random() * FULL_STORIES.length);
      const chosen = FULL_STORIES[randomIndex];
      showToast(`تم فتح: #${chosen.id} ${chosen.title}`);
      openStoryReader(chosen.id);
    }

    function shareCurrentStory() {
      if (!currentStory) return;
      const text = `ملف جنائي حقيقي: #${currentStory.id} ${currentStory.title} (${currentStory.countryName} - ${currentStory.city}) من الموسوعة الجنائية المغاربية.`;
      if (navigator.share) {
        navigator.share({
          title: currentStory.title,
          text: text,
          url: window.location.href
        }).catch(() => {});
      } else {
        const dummy = document.createElement('textarea');
        dummy.value = `${text}\n${window.location.href}`;
        document.body.appendChild(dummy);
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        showToast("تم نسخ رابط وتفاصيل القضية للحافظة");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toastMsg');
      text.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }
  </script>
</body>
</html>
