<!DOCTYPE html>

  <!-- إعدادات iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أرشيف الجرائم">
  <meta name="theme-color" content="#060608">

  <!-- الخطوط العربية: Cairo للعناوين و Amiri للسرد التوثيقي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- مكتبة الأيقونات Phosphor -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            noir: {
              950: '#060608',
              900: '#0c0c12',
              850: '#13131c',
              800: '#1b1b26',
              750: '#232332',
              700: '#2d2d40',
              muted: '#8a8aa0',
              accent: '#dc2626'
            }
          },
          fontFamily: {
            sans: ['Cairo', 'system-ui', 'sans-serif'],
            narrative: ['Amiri', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 20px);
      --sab: env(safe-area-inset-bottom, 20px);
    }
    body {
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #060608;
    }
    .safe-nav-space {
      padding-bottom: calc(var(--sab) + 80px);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .reader-text { user-select: text; }
    /* ثيمات شاشة القارئ */
    .reader-black { background-color: #060608 !important; color: #e2e8f0; }
    .reader-sepia { background-color: #1a1612 !important; color: #dfcfb8; }
    .reader-gray  { background-color: #181920 !important; color: #f1f5f9; }
    .card-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7), 0 0 1px 1px rgba(255, 255, 255, 0.04);
    }
  </style>
</head>

<body class="text-neutral-100 font-sans min-h-screen flex flex-col antialiased selection:bg-red-700 selection:text-white">

  <!-- ================= الترويسة العلوية iOS Header ================= -->

    <div class="flex items-center space-x-2.5 space-x-reverse">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-red-950 via-red-900 to-red-600 flex items-center justify-center text-white shadow-lg border border-red-500/40">
        <i class="ph-fill ph-fingerprint text-2xl"></i>
      </div>
      <div>
        <div class="flex items-center space-x-1.5 space-x-reverse">
          <h1 class="text-sm font-black tracking-wide text-white">أرشيف الجرائم</h1>
          <span class="px-1.5 py-0.5 rounded text-[9px] font-black bg-red-600/30 text-red-400 border border-red-500/30">المغرب العربي</span>
        </div>
        <p class="text-[10px] text-noir-muted">50 قضية واقعية موثقة من سجلات الأمن والقضاء</p>
      </div>
    </div>

    <!-- أزرار تفاعلية سريعة -->
    <div class="flex items-center space-x-1.5 space-x-reverse">
      <!-- زر قضية عشوائية الليلة -->
      <button onclick="pickRandomStory()" class="w-9 h-9 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-amber-400 active:scale-90 transition" title="قضية عشوائية">
        <i class="ph-bold ph-dice-five text-lg"></i>
      </button>
      <!-- زر الصوت البوليسي -->
      <button id="soundBtn" onclick="toggleAtmosphereAudio()" class="w-9 h-9 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-noir-muted active:scale-90 transition" title="صوت الغموض">
        <i id="soundIcon" class="ph-bold ph-speaker-simple-slash text-lg"></i>
      </button>
    </div>
  </header>

  <!-- ================= شريط الإحصائيات الفوري (Stats Banner) ================= -->
  <div class="px-4 pt-3">
    <div class="bg-noir-900 border border-noir-800 rounded-2xl p-3 grid grid-cols-3 gap-2 text-center text-xs">
      <div class="border-l border-noir-800 pl-2">
        <div class="text-[10px] text-noir-muted font-bold">إجمالي القضايا</div>
        <div class="text-base font-black text-white font-sans mt-0.5" id="statTotalCount">50</div>
      </div>
      <div class="border-l border-noir-800 pl-2">
        <div class="text-[10px] text-noir-muted font-bold">تمت قراءتها</div>
        <div class="text-base font-black text-emerald-400 font-sans mt-0.5" id="statReadCount">0</div>
      </div>
      <div>
        <div class="text-[10px] text-noir-muted font-bold">في المفضلة</div>
        <div class="text-base font-black text-amber-400 font-sans mt-0.5" id="statFavCount">0</div>
      </div>
    </div>
  </div>

  <!-- ================= المحتوى الرئيسي ================= -->
  <main class="flex-1 overflow-y-auto px-4 pt-3 safe-nav-space no-scrollbar">
    
    <!-- حقل البحث الفوري -->
    <div class="relative mb-3">
      <i class="ph-bold ph-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-noir-muted text-sm"></i>
      <input type="text" id="searchInput" placeholder="ابحث باسم القضية، الشخصية، المدينة، أو نوع الجريمة..." 
             class="w-full bg-noir-900 border border-noir-800 rounded-2xl pr-10 pl-9 py-2.5 text-xs text-white placeholder-noir-muted focus:outline-none focus:border-red-600 transition">
      <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute left-3 top-1/2 -translate-y-1/2 text-noir-muted text-xs p-1">
        <i class="ph-bold ph-x-circle text-base"></i>
      </button>
    </div>

    <!-- الفلاتر السريعة بالأزرار الأفقية -->
    <div class="flex items-center space-x-2 space-x-reverse overflow-x-auto no-scrollbar pb-2 pt-0.5">
      <button onclick="applyFilter('all', this)" class="filter-pill active px-3.5 py-1.5 rounded-xl bg-red-600 text-white text-xs font-bold whitespace-nowrap active:scale-95 transition">
        📚 الكل (50)
      </button>
      <button onclick="applyFilter('tunisia', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-neutral-300 text-xs font-bold whitespace-nowrap active:scale-95 transition">
        🇹🇳 تونس (<span id="countTunisia">0</span>)
      </button>
      <button onclick="applyFilter('morocco', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-neutral-300 text-xs font-bold whitespace-nowrap active:scale-95 transition">
        🇲🇦 المغرب (<span id="countMorocco">0</span>)
      </button>
      <button onclick="applyFilter('algeria', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-neutral-300 text-xs font-bold whitespace-nowrap active:scale-95 transition">
        🇩🇿 الجزائر (<span id="countAlgeria">0</span>)
      </button>
      <button onclick="applyFilter('bookmarks', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-amber-400 text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1">
        <i class="ph-bold ph-bookmark"></i> المفضلة
      </button>
      <button onclick="applyFilter('unread', this)" class="filter-pill px-3.5 py-1.5 rounded-xl bg-noir-850 border border-noir-800 text-emerald-400 text-xs font-bold whitespace-nowrap active:scale-95 transition flex items-center gap-1">
        <i class="ph-bold ph-sparkle"></i> لم أقرأها
      </button>

      </button>

        💰 سطو ونهب
      </button>
    </div>

    <!-- شبكة عرض القضايا (Stories List) -->
    <div id="storiesContainer" class="space-y-3 pt-1">
      <!-- يتم التوليد التلقائي عبر JavaScript -->
    </div>
  </main>

  <!-- ================= شاشة القارئ المتقدمة (Zen Reader Modal) ================= -->
  <div id="readerModal" class="fixed inset-0 z-50 bg-noir-950 flex flex-col hidden reader-black">
    
    <!-- شريط تقدم القراءة -->
    <div class="w-full bg-noir-850 h-1">
      <div id="readerProgress" class="h-1 bg-red-600 transition-all duration-150 w-0"></div>
    </div>

    <!-- ترويسة القارئ -->
    <div class="glass border-b border-noir-800/80 px-4 py-2.5 flex items-center justify-between" style="padding-top: max(10px, env(safe-area-inset-top));">
      <button onclick="closeReader()" class="flex items-center space-x-1 space-x-reverse text-red-400 font-bold text-xs active:scale-90 transition">
        <i class="ph-bold ph-caret-right text-base"></i>
        <span>المكتبة</span>
      </button>

      <!-- أدوات القارئ -->
      <div class="flex items-center space-x-2 space-x-reverse">
        <!-- حجم الخط -->
        <div class="flex items-center bg-noir-850 border border-noir-800 rounded-xl px-2 py-0.5 space-x-1 space-x-reverse">
          <button onclick="adjustFont(-1)" class="text-xs font-bold text-neutral-300 px-1 py-0.5 active:scale-75">-أ</button>
          <span class="text-[10px] text-noir-muted">الخط</span>
          <button onclick="adjustFont(1)" class="text-xs font-bold text-neutral-300 px-1 py-0.5 active:scale-75">+أ</button>
        </div>

        <button onclick="toggleReaderTheme()" class="w-8 h-8 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-amber-400 active:scale-90" title="لون الخلفية">

        </button>

        <button onclick="shareCurrentStory()" class="w-8 h-8 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-neutral-300 active:scale-90" title="مشاركة">
          <i class="ph-bold ph-share-network text-sm"></i>
        </button>

        <!-- مفضلة -->
        <button id="readerFavBtn" onclick="toggleReaderFavorite()" class="w-8 h-8 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-sm active:scale-90">
          <i id="readerFavIcon" class="ph-bold ph-bookmark-simple text-neutral-300"></i>
        </button>
      </div>
    </div>

      <!-- محتوى القصة يُحقن هنا -->
    </div>
  </div>

    let currentFilter = 'all';

    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderStoriesList();
      initSearchListener();
      updateCountryCounts();
    });

    // تحديث الإحصائيات
    function getStoredBookmarks() {
      try { return JSON.parse(localStorage.getItem('maghreb_50_favs')) || []; } catch { return []; }
    }
    function getStoredRead() {
      try { return JSON.parse(localStorage.getItem('maghreb_50_read')) || []; } catch { return []; }
    }

    function updateStats() {
      const favs = getStoredBookmarks();
      const read = getStoredRead();
      document.getElementById('statTotalCount').textContent = CRIMES_DB.length;
      document.getElementById('statReadCount').textContent = read.length;
      document.getElementById('statFavCount').textContent = favs.length;
    }

    function updateCountryCounts() {
      document.getElementById('countTunisia').textContent = CRIMES_DB.filter(c => c.country === 'tunisia').length;
      document.getElementById('countMorocco').textContent = CRIMES_DB.filter(c => c.country === 'morocco').length;
      document.getElementById('countAlgeria').textContent = CRIMES_DB.filter(c => c.country === 'algeria').length;
    }

    // تصفية وعرض القضايا
    function applyFilter(filterKey, btnElement) {
      currentFilter = filterKey;
      document.querySelectorAll('.filter-pill').forEach(b => {
        b.classList.remove('bg-red-600', 'text-white');
        b.classList.add('bg-noir-850', 'text-neutral-300', 'border', 'border-noir-800');
      });
      if (btnElement) {
        btnElement.classList.remove('bg-noir-850', 'text-neutral-300', 'border', 'border-noir-800');
        btnElement.classList.add('bg-red-600', 'text-white');
      }
      renderStoriesList();
    }

    function initSearchListener() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      input.addEventListener('input', () => {
        if (input.value.length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }
        renderStoriesList();
      });
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderStoriesList();
    }

    function renderStoriesList() {
      const container = document.getElementById('storiesContainer');
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const favs = getStoredBookmarks();
      const read = getStoredRead();

      const filtered = CRIMES_DB.filter(item => {
        // فلتر البحث
        const qMatch = !query || 
          item.title.toLowerCase().includes(query) ||
          item.city.toLowerCase().includes(query) ||
          item.countryName.toLowerCase().includes(query) ||
          item.teaser.toLowerCase().includes(query) ||
          item.category.toLowerCase().includes(query);

        if (!qMatch) return false;

        // فلتر الفئات
        if (currentFilter === 'all') return true;
        if (currentFilter === 'tunisia') return item.country === 'tunisia';
        if (currentFilter === 'morocco') return item.country === 'morocco';
        if (currentFilter === 'algeria') return item.country === 'algeria';
        if (currentFilter === 'bookmarks') return favs.includes(item.id);
        if (currentFilter === 'unread') return !read.includes(item.id);
        if (currentFilter === 'cat-serial') return item.catKey === 'cat-serial';
        if (currentFilter === 'cat-heist') return item.catKey === 'cat-heist';

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-noir-muted space-y-2">
            <i class="ph-bold ph-magnifying-glass text-4xl text-neutral-600"></i>
            <p class="text-xs">لم نجد أي قضية تطابق هذا البحث أو الفلتر.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(story => {
        const isFav = favs.includes(story.id);
        const isRead = read.includes(story.id);

        return `
          <div onclick="openStoryReader(${story.id})" class="bg-noir-900 border border-noir-800 rounded-3xl p-4 card-shadow active:scale-[0.99] transition cursor-pointer space-y-3 relative overflow-hidden group">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2 space-x-reverse">
                <span class="text-xs px-2.5 py-0.5 rounded-full font-bold bg-noir-800 border border-noir-750 text-neutral-200">
                  ${story.flag} ${story.countryName}
                </span>
                <span class="text-[11px] text-noir-muted font-mono">${story.year}</span>
                <span class="text-[10px] px-2 py-0.5 rounded bg-noir-850 text-red-400 font-bold border border-noir-800">${story.category}</span>
              </div>

              <div class="flex items-center space-x-1.5 space-x-reverse" onclick="event.stopPropagation()">
                ${isRead ? `
                  <span class="px-2 py-0.5 rounded text-[10px] font-black bg-emerald-950/70 text-emerald-400 border border-emerald-800 flex items-center gap-1">
                    <i class="ph-bold ph-check"></i> مقروءة
                  </span>
                ` : ''}
                <button onclick="toggleFavorite(${story.id})" class="w-8 h-8 rounded-xl bg-noir-850 border border-noir-800 flex items-center justify-center text-xs active:scale-90 transition">
                  <i class="${isFav ? 'ph-fill ph-bookmark text-red-500' : 'ph-bold ph-bookmark-simple text-neutral-400'} text-sm"></i>
                </button>
              </div>
            </div>

            <div>
              <div class="flex items-baseline gap-2">
                <span class="text-xs font-mono font-bold text-red-500">#${story.id}</span>
                <h3 class="text-sm font-black text-white group-hover:text-red-400 transition leading-snug">${story.title}</h3>
              </div>
              <p class="text-xs text-neutral-300 mt-1 line-clamp-2 leading-relaxed">${story.teaser}</p>
            </div>

            <div class="flex items-center justify-between text-[11px] text-noir-muted pt-2 border-t border-noir-800">
              <span class="flex items-center gap-1">
                <i class="ph-bold ph-map-pin text-red-500"></i> ${story.city}
              </span>
              <span class="flex items-center gap-1 text-red-400 font-bold text-xs">
                فتح الملف الجنائي <i class="ph-bold ph-caret-left"></i>
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    // ================= قارئ القصة المفصل =================
    function openStoryReader(id) {
      const story = CRIMES_DB.find(s => s.id === id);
      if (!story) return;
      currentStory = story;

      const scrollArea = document.getElementById('readerScroll');
      const favs = getStoredBookmarks();
      const read = getStoredRead();

            <span class="text-xs text-noir-muted font-sans font-bold">⏱ قراءة ${story.readMin} دقائق</span>

          <h1 class="text-xl font-black text-white leading-tight font-sans pt-1">
            <span class="text-red-500">#${story.id}</span> ${story.title}
          </h1>

          <div class="flex flex-wrap items-center gap-3 text-xs text-noir-muted pt-1">
            <span>📍 الموقع: <strong class="text-neutral-300">${story.city}</strong></span>
            <span>📅 الفترة: <strong class="text-neutral-300">${story.year}</strong></span>
            <span>📂 التصنيف: <strong class="text-red-400">${story.category}</strong></span>
          </div>
        </div>

        <!-- السرد المقسم إلى 4 محاور موثقة -->
        <div class="space-y-5 font-narrative leading-loose pt-1">
          
          <!-- المحور 1: البداية والوقائع -->
          <article class="bg-noir-900/40 p-4 rounded-3xl border border-noir-800/60 space-y-2">
            <h2 class="text-sm font-bold text-red-400 font-sans flex items-center gap-2">
              <span class="w-6 h-6 rounded-lg bg-red-950 text-red-400 flex items-center justify-center text-xs font-black font-sans">١</span>
              البداية والوقائع الصادمة
            </h2>
            <p class="story-p text-neutral-200 text-justify" style="font-size: ${readerFontSize}px;">
              ${story.origin}
            </p>
          </article>

          <!-- المحور 2: التحريات وخيوط البحث -->
          <article class="bg-noir-900/40 p-4 rounded-3xl border border-noir-800/60 space-y-2">
            <h2 class="text-sm font-bold text-red-400 font-sans flex items-center gap-2">
              <span class="w-6 h-6 rounded-lg bg-red-950 text-red-400 flex items-center justify-center text-xs font-black font-sans">٢</span>
              خيوط التحقيق والشرطة الفنية
            </h2>
            <p class="story-p text-neutral-200 text-justify" style="font-size: ${readerFontSize}px;">
              ${story.investigation}
            </p>
          </article>

          <!-- المحور 3: السقوط والمحاكمة -->
          <article class="bg-noir-900/40 p-4 rounded-3xl border border-noir-800/60 space-y-2">
            <h2 class="text-sm font-bold text-red-400 font-sans flex items-center gap-2">
              <span class="w-6 h-6 rounded-lg bg-red-950 text-red-400 flex items-center justify-center text-xs font-black font-sans">٣</span>
              سقوط الجناة وحكم المحكمة
            </h2>
            <p class="story-p text-neutral-200 text-justify" style="font-size: ${readerFontSize}px;">
              ${story.trial}
            </p>
          </article>

          <!-- المحور 4: الأثر المجتمعي والعبرة -->
          <article class="bg-noir-900/40 p-4 rounded-3xl border border-noir-800/60 space-y-2">
            <h2 class="text-sm font-bold text-red-400 font-sans flex items-center gap-2">
              <span class="w-6 h-6 rounded-lg bg-red-950 text-red-400 flex items-center justify-center text-xs font-black font-sans">٤</span>
              الأثر والدروس في علم الجريمة
            </h2>
            <p class="story-p text-neutral-200 text-justify" style="font-size: ${readerFontSize}px;">
              ${story.impact}
            </p>
          </article>
        </div>

        <!-- أزرار الإجراءات في أسفل القارئ -->
        <div class="pt-4 pb-2 space-y-2.5 font-sans">
          <button onclick="toggleStoryAsRead(${story.id})" id="btnMarkRead" class="w-full ${isRead ? 'bg-emerald-900 text-emerald-300' : 'bg-red-600 text-white'} font-bold py-3.5 rounded-2xl text-xs active:scale-95 transition flex items-center justify-center gap-2 shadow-lg">
            <i class="ph-bold ${isRead ? 'ph-check-circle' : 'ph-check'} text-base"></i>
            <span>${isRead ? 'تمت قراءة هذا الملف (اضغط للإلغاء)' : 'تعليم كـ تمت القراءة (حفظ الإنجاز)'}</span>
          </button>
          
          <button onclick="closeReader()" class="w-full bg-noir-850 text-neutral-300 font-bold py-3 rounded-2xl text-xs active:scale-95 transition">
            العودة للمكتبة العامة
          </button>
        </div>
      `;

      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      scrollArea.scrollTop = 0;
    }

    function closeReader() {
      document.getElementById('readerModal').classList.add('hidden');
      document.body.style.overflow = 'auto';
      currentStory = null;
      renderStoriesList();
      updateStats();
    }

    // شريط تقدم التمرير
    function handleScrollProgress() {
      const area = document.getElementById('readerScroll');
      const bar = document.getElementById('readerProgress');
      const max = area.scrollHeight - area.clientHeight;
      if (max > 0) {
        const pct = (area.scrollTop / max) * 100;
        bar.style.width = `${Math.min(100, Math.max(0, pct))}%`;
      }
    }

    // تعديل حجم الخط
    function adjustFont(delta) {
      readerFontSize = Math.min(26, Math.max(15, readerFontSize + delta));
      document.querySelectorAll('.story-p').forEach(p => {
        p.style.fontSize = `${readerFontSize}px`;
      });
    }

    // تبديل الثيم
    function toggleReaderTheme() {
      const modal = document.getElementById('readerModal');
      readerThemes.forEach(t => modal.classList.remove(t));
      readerThemeIndex = (readerThemeIndex + 1) % readerThemes.length;
      modal.classList.add(readerThemes[readerThemeIndex]);
    }

    // إدارة المفضلة
    function toggleFavorite(id) {
      let favs = getStoredBookmarks();
      if (favs.includes(id)) {
        favs = favs.filter(x => x !== id);
        showToast("تم الحذف من المفضلة");
      } else {
        favs.push(id);
        showToast("تمت الإضافة إلى المفضلة");
      }
      localStorage.setItem('maghreb_50_favs', JSON.stringify(favs));
      updateStats();
      renderStoriesList();
      if (currentStory && currentStory.id === id) {
        const favIcon = document.getElementById('readerFavIcon');
        favIcon.className = favs.includes(id) ? 'ph-fill ph-bookmark text-red-500 text-sm' : 'ph-bold ph-bookmark-simple text-neutral-300 text-sm';
      }
    }

    function toggleReaderFavorite() {
      if (currentStory) toggleFavorite(currentStory.id);
    }

    // تعليم كـ تمت القراءة
    function toggleStoryAsRead(id) {
      let read = getStoredRead();
      const btn = document.getElementById('btnMarkRead');
      if (read.includes(id)) {
        read = read.filter(x => x !== id);
        showToast("أعيدت القصة إلى قائمة غير المقروءة");
        if (btn) {
          btn.className = "w-full bg-red-600 text-white font-bold py-3.5 rounded-2xl text-xs active:scale-95 transition flex items-center justify-center gap-2 shadow-lg";
          btn.innerHTML = `<i class="ph-bold ph-check text-base"></i><span>تعليم كـ تمت القراءة (حفظ الإنجاز)</span>`;
        }
      } else {
        read.push(id);
        showToast("أحسنت! سُجلت القضية في أرشيفك الشخصي");
        if (btn) {
          btn.className = "w-full bg-emerald-900 text-emerald-300 font-bold py-3.5 rounded-2xl text-xs active:scale-95 transition flex items-center justify-center gap-2 shadow-lg";
          btn.innerHTML = `<i class="ph-bold ph-check-circle text-base"></i><span>تمت قراءة هذا الملف (اضغط للإلغاء)</span>`;
        }
      }
      localStorage.setItem('maghreb_50_read', JSON.stringify(read));
      updateStats();
    }

    // اختيار قضية عشوائية "قضية الليلة"
    function pickRandomStory() {
      const randomIndex = Math.floor(Math.random() * CRIMES_DB.length);
      const chosen = CRIMES_DB[randomIndex];
      showToast(`تم اختيار: ${chosen.title}`);
      openStoryReader(chosen.id);
    }

    // مشاركة القصة
    function shareCurrentStory() {
      if (!currentStory) return;
      const text = `ملف جنائي حقيقي: ${currentStory.title} (${currentStory.countryName} - ${currentStory.city}) من أرشيف الجرائم المغاربية.`;
      if (navigator.share) {
        navigator.share({
          title: currentStory.title,
          text: text,
          url: window.location.href
        }).catch(() => {});
      } else {
        // نسخ للنظام
        const dummy = document.createElement('textarea');
        dummy.value = `${text}\n${window.location.href}`;
        document.body.appendChild(dummy);
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        showToast("تم نسخ رابط وتفاصيل القضية للحافظة");
      }
    }

    // تنبيه Toast
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toastMsg');
      text.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    // خلفية الصوت البوليسي الغامض (Web Audio API الخفيف)
    function toggleAtmosphereAudio() {
      const btn = document.getElementById('soundBtn');
      const icon = document.getElementById('soundIcon');

      if (!isSoundOn) {
        startAmbient();
        isSoundOn = true;
        icon.className = 'ph-fill ph-speaker-high text-red-500 text-lg';
        btn.classList.add('border-red-600');
        showToast("تم تشغيل جو الغموض الصوتي");
      } else {
        stopAmbient();
        isSoundOn = false;
        icon.className = 'ph-bold ph-speaker-simple-slash text-noir-muted text-lg';
        btn.classList.remove('border-red-600');
        showToast("تم إيقاف الصوت");
      }
    }

    function startAmbient() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtx();

        osc1 = audioCtx.createOscillator();
        osc2 = audioCtx.createOscillator();
        masterGain = audioCtx.createGain();

        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(50, audioCtx.currentTime);

        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(54, audioCtx.currentTime);

        masterGain.gain.setValueAtTime(0.06, audioCtx.currentTime);

        osc1.connect(masterGain);
        osc2.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        osc1.start();
        osc2.start();
      } catch (e) {
        console.warn('Audio non supporté:', e);
      }
    }

    function stopAmbient() {
      try {
        if (osc1) osc1.stop();
        if (osc2) osc2.stop();
        if (audioCtx) audioCtx.close();
      } catch {}
    }
  </script>
</body>
</html>
